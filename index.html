<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Network-5G</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">

   <script type="module" defer src="/javascript/main.js"></script>
   <script type="module" defer src="/javascript/todo-create-task.js"></script>
   <link rel="stylesheet" href="styles/index.css">
</head>
<body>
<header>
   <div class="logo">
      <a href="#"><img src="Resurs/IMG/logo-1.png" alt="logo-1"></a>
   </div>
   <div class="mobile__only__title__header">
      <h2 class="mobile__only__title__header__h2">Мой дневник</h2>
   </div>
         <nav class="header__navigation">
            <ul>
            <li><a href="#">Понедельник</a></li>
            <li><a href="#">Вторник</a></li>
            <li><a href="#">Среда</a></li>
            <li><a href="#">Четверг</a></li>
            <li><a href="#">Пятница</a></li>
            <li><a href="#">Суббота</a></li>
            <li><a href="#">Воскресенье</a></li>
            </ul>
         </nav>

   <!--Кнопка бургер-->
   <div class="mobile__only__burger">
      <a href="#" class="burger-menu_button">
         <span class="burger-menu_lines"></span>
      </a>
      <nav class="burger-menu_nav">
         <a href="#" class="burger-menu_link">Понедельник</a>
         <a href="#" class="burger-menu_link">Вторник</a>
         <a href="#" class="burger-menu_link">Среда</a>
         <a href="#" class="burger-menu_link">Четверг</a>
         <a href="#" class="burger-menu_link">Пятница</a>
         <a href="#" class="burger-menu_link">Суббота</a>
         <a href="#" class="burger-menu_link">Воскресенье</a>
      </nav>
      <div class="burger-menu_overlay"></div>
   </div>
</header>

<section class="task__container">
   <div class="todo" data-js-todo>
      <h2 class="todo__title">Задания на неделю</h2>
      <form class="todo__form" data-js-todo-new-task-form>
         <div class="todo__field field">
            <label
               class="field__label"
               for="new-task"
               >
               Новое напоминание!
            </label>

            <input
               class="field__input"
               id="new-task"
               placeholder=" "
               autocomplete="off"
               data-js-todo-new-task-input
            />
         </div>
         <button class="button" type="submit">Add</button>
      </form>
      <form class="todo__form" data-js-todo-search-task-form>
         <div class="todo__field field">
            <label
               class="field__label"
               for="search-task"
            >
               Поиск задач
            </label>

            <input
               class="field__input"
               id="search-task"
               placeholder=" "
               autocomplete="off"
               type="search"
               data-js-todo-search-task-input
            />
         </div>

      </form>
      <div class="todo__info">
         <div class="todo__total__task">
            Итого задач: <span data-js-todo-total-tasks>0</span>
         </div>
         <button
            class="todo__delete-all-button"
            type="button"
            data-js-todo-delete-all-button
         >
            Удалить все!
         </button>
      </div>
      <ul class="todo__list" data-js-todo-list></ul>
      <div class="todo__empty-message" data-js-todo-empty-message></div>
   </div>
</section>

   <footer>

   </footer>
</body>
</html>
